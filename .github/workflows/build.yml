name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Build + test (Linux)
        run: |
          make all
          ./build/atw_tests
          ./build/atw --headless --frames 300

      - name: Build Windows .exe (MinGW)
        id: winbuild
        shell: bash
        run: |
          set +e
          x86_64-w64-mingw32-g++ -std=c++20 -O3 -ffast-math -Wall -Wextra -mwindows -static \
            -o atw.exe src/main.cpp src/core/window_win32.cpp src/core/window_headless.cpp \
            src/render/gl.cpp src/render/renderer.cpp src/game/game.cpp \
            src/audio/audio.cpp src/audio/audio_win32.cpp \
            -lopengl32 -lgdi32 -luser32 -lwinmm -static-libgcc -static-libstdc++ > winbuild.log 2>&1
          code=$?
          cat winbuild.log
          echo "exit=$code" >> winbuild.log
          exit $code

      - name: Publish build diagnostics to ci/logs
        if: always()
        shell: bash
        run: |
          # The .exe is the shipped artifact, so record what it actually is
          # (size, imported DLLs, hash) on the ci/logs branch: that is the only
          # copy of the build output we can read back without downloading it.
          {
            echo "== toolchain =="
            x86_64-w64-mingw32-g++ --version | head -2
            echo "== atw.exe =="
            ls -l atw.exe 2>/dev/null || echo "no atw.exe"
            sha256sum atw.exe 2>/dev/null
            echo "== imported DLLs (must not include libstdc++ / libgcc) =="
            x86_64-w64-mingw32-objdump -p atw.exe 2>/dev/null | grep "DLL Name" || true
            echo "== Linux binary =="
            ls -l build/atw 2>/dev/null || true
            echo "== build log =="
            cat winbuild.log 2>/dev/null || true
          } > diagnostics.txt 2>&1
          git config user.name  "CI"
          git config user.email "ci@users.noreply.github.com"
          git add -f diagnostics.txt winbuild.log 2>/dev/null || git add -f diagnostics.txt
          git commit -m "build diagnostics" || true
          git push origin "HEAD:ci/logs" --force || true

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: against-the-wall
          path: |
            atw.exe
            build/atw
          if-no-files-found: ignore

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: atw.exe
          name: Against the Wall ${{ github.ref_name }}
          body: |
            Windows .exe build of the Against the Wall C++20 prototype.

            Download `atw.exe` and double-click to play. Requires a Windows 10/11
            GPU driver with OpenGL 3.3 support (any standard Intel/NVIDIA/AMD
            driver). If SmartScreen warns, click **More info** → **Run anyway**.
